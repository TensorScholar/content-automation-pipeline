# =============================================================================
# Redis Sentinel High Availability Configuration
# =============================================================================
#
# Provides Redis high availability with automatic failover.
#
# Usage:
#   docker-compose -f docker-compose.prod.yml -f docker-compose.redis-sentinel.yml up -d
#
# Architecture:
#   - 1 Redis Master
#   - 2 Redis Replicas
#   - 3 Sentinel nodes for quorum
# =============================================================================

version: '3.9'

services:
  # Override the default Redis to become master
  redis:
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      content-automation-network:
        aliases:
          - redis-master

  # Redis Replica 1
  redis-replica-1:
    image: redis:7-alpine
    container_name: content-automation-redis-replica-1
    restart: unless-stopped
    command: redis-server --replicaof redis-master 6379 --appendonly yes
    depends_on:
      - redis
    networks:
      - content-automation-network
    deploy:
      resources:
        limits:
          memory: 512M

  # Redis Replica 2
  redis-replica-2:
    image: redis:7-alpine
    container_name: content-automation-redis-replica-2
    restart: unless-stopped
    command: redis-server --replicaof redis-master 6379 --appendonly yes
    depends_on:
      - redis
    networks:
      - content-automation-network
    deploy:
      resources:
        limits:
          memory: 512M

  # Sentinel 1
  redis-sentinel-1:
    image: redis:7-alpine
    container_name: content-automation-sentinel-1
    restart: unless-stopped
    command: >
      sh -c "echo 'sentinel monitor mymaster redis-master 6379 2' > /tmp/sentinel.conf &&
             echo 'sentinel down-after-milliseconds mymaster 5000' >> /tmp/sentinel.conf &&
             echo 'sentinel failover-timeout mymaster 60000' >> /tmp/sentinel.conf &&
             echo 'sentinel parallel-syncs mymaster 1' >> /tmp/sentinel.conf &&
             redis-sentinel /tmp/sentinel.conf"
    depends_on:
      - redis
      - redis-replica-1
      - redis-replica-2
    networks:
      - content-automation-network
    deploy:
      resources:
        limits:
          memory: 128M

  # Sentinel 2
  redis-sentinel-2:
    image: redis:7-alpine
    container_name: content-automation-sentinel-2
    restart: unless-stopped
    command: >
      sh -c "echo 'sentinel monitor mymaster redis-master 6379 2' > /tmp/sentinel.conf &&
             echo 'sentinel down-after-milliseconds mymaster 5000' >> /tmp/sentinel.conf &&
             echo 'sentinel failover-timeout mymaster 60000' >> /tmp/sentinel.conf &&
             echo 'sentinel parallel-syncs mymaster 1' >> /tmp/sentinel.conf &&
             redis-sentinel /tmp/sentinel.conf"
    depends_on:
      - redis
      - redis-replica-1
      - redis-replica-2
    networks:
      - content-automation-network
    deploy:
      resources:
        limits:
          memory: 128M

  # Sentinel 3
  redis-sentinel-3:
    image: redis:7-alpine
    container_name: content-automation-sentinel-3
    restart: unless-stopped
    command: >
      sh -c "echo 'sentinel monitor mymaster redis-master 6379 2' > /tmp/sentinel.conf &&
             echo 'sentinel down-after-milliseconds mymaster 5000' >> /tmp/sentinel.conf &&
             echo 'sentinel failover-timeout mymaster 60000' >> /tmp/sentinel.conf &&
             echo 'sentinel parallel-syncs mymaster 1' >> /tmp/sentinel.conf &&
             redis-sentinel /tmp/sentinel.conf"
    depends_on:
      - redis
      - redis-replica-1
      - redis-replica-2
    networks:
      - content-automation-network
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  content-automation-network:
    external: true
