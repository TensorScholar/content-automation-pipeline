# ============================================================================
# Monitoring Stack - Docker Compose Configuration
# Prometheus + Grafana + Infrastructure Exporters
# ============================================================================
#
# Usage:
#   docker compose -f docker-compose.prod.yml -f docker/docker-compose.monitoring.yml up -d
#
# This file extends the production stack with:
#   - Prometheus (metrics collection)
#   - Grafana (dashboards & visualization)
#   - PostgreSQL Exporter (database metrics)
#   - Redis Exporter (cache metrics)
#   - Node Exporter (system/host metrics)
# ============================================================================

version: "3.9"

services:
  # --------------------------------------------------------------------------
  # Prometheus - Metrics Collection
  # --------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: content-automation-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - content-automation-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9090/-/healthy",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      - api

  # --------------------------------------------------------------------------
  # Grafana - Dashboards & Visualization
  # --------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.1.0
    container_name: content-automation-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Admin credentials. Fail closed: no default password is accepted.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}

      # Configuration
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "https://${GRAFANA_SERVER_NAME:-${SERVER_NAME:-localhost}}/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"

      # Security
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_HTTPONLY: "true"
      GF_SECURITY_COOKIE_SAMESITE: "Lax"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - content-automation-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # --------------------------------------------------------------------------
  # PostgreSQL Exporter - Database Metrics
  # Exposes PostgreSQL server metrics on :9187/metrics
  # --------------------------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: content-automation-postgres-exporter
    restart: unless-stopped
    environment:
      # Defaults to the local Compose PostgreSQL. Override POSTGRES_EXPORTER_DSN
      # when PostgreSQL is external (sslmode/sslcert as required by the provider).
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DSN:-postgresql://content_user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/content_automation?sslmode=disable}
    networks:
      - content-automation-network
    depends_on:
      - postgres
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9187/metrics",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # Redis Exporter - Cache Metrics
  # Exposes Redis server metrics on :9121/metrics
  # --------------------------------------------------------------------------
  redis-exporter:
    image: oliver006/redis_exporter:v1.61.0
    container_name: content-automation-redis-exporter
    restart: unless-stopped
    environment:
      # Defaults to the local Compose Redis. Override REDIS_EXPORTER_ADDR when
      # Redis is external (e.g. rediss://:PASSWORD@redis.example.com:6379).
      # The local Compose redis service already enforces REDIS_PASSWORD.
      REDIS_ADDR: ${REDIS_EXPORTER_ADDR:-redis://redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    networks:
      - content-automation-network
    depends_on:
      - redis
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9121/metrics",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # Node Exporter - System / Host Metrics
  # Exposes host-level CPU, memory, disk, and network metrics on :9100/metrics
  # --------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: content-automation-node-exporter
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - content-automation-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9100/metrics",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

networks:
  content-automation-network:
    driver: bridge

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
