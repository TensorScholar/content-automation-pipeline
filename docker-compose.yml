# ============================================================================
# Docker Compose Configuration
# Complete system orchestration with dependencies
# ============================================================================

version: '3.9'

services:
  # --------------------------------------------------------------------------
  # PostgreSQL Database
  # --------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: content-automation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: content_automation
      POSTGRES_USER: content_user
      # SECURITY: No default - must be set in .env file
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - set in .env file}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U content_user -d content_automation" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - content-automation-network

  # --------------------------------------------------------------------------
  # Redis Cache
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: content-automation-redis
    restart: unless-stopped
    # L-5 fix: requirepass prevents unauthenticated access from other containers on the Docker network
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required - set in .env file}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      # L-5: health check must authenticate too
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - content-automation-network

  # --------------------------------------------------------------------------
  # API Server
  # --------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: content-automation-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database configuration
      DATABASE_URL: postgresql://content_user:${POSTGRES_PASSWORD:?Required}@postgres:5432/content_automation

      # Redis configuration — L-5: authenticated URL to match requirepass
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1

      # LLM configuration - Anthropic is the default provider
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LOCAL_LLM_URL: ${LOCAL_LLM_URL:-http://ollama:11434/v1}

      # Application configuration
      MONITORING_LOG_LEVEL: ${MONITORING_LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1,api}"

      # Security - REQUIRED: No default allowed
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY required - run openssl rand -hex 32}"
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      GOOGLE_SEARCH_CONSOLE_CLIENT_ID: ${GOOGLE_SEARCH_CONSOLE_CLIENT_ID:-}
      GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET: ${GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET:-}
      GOOGLE_SEARCH_CONSOLE_REDIRECT_URI: ${GOOGLE_SEARCH_CONSOLE_REDIRECT_URI:-}
      GOOGLE_SEARCH_CONSOLE_FRONTEND_RETURN_URL: ${GOOGLE_SEARCH_CONSOLE_FRONTEND_RETURN_URL:-http://localhost:3001/?search_console=connected}

      # Performance tuning
      WORKERS: ${WORKERS:-4}
      MAX_CONNECTIONS: ${MAX_CONNECTIONS:-100}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - content-automation-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

  # --------------------------------------------------------------------------
  # Ollama (Local LLM)
  # --------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: content-automation-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - content-automation-network
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [ "gpu" ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:11434/api/tags" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # --------------------------------------------------------------------------
  # Celery Worker
  # --------------------------------------------------------------------------
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: content-automation-celery
    restart: unless-stopped
    command: celery -A orchestration.celery_app.app worker --loglevel=info --concurrency=4 -Q critical,high,medium,default,low,integrations
    healthcheck:
      test: [ "CMD-SHELL", "celery -A orchestration.celery_app.app inspect ping -d \"celery@$$HOSTNAME\" --timeout=15" ]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://content_user:${POSTGRES_PASSWORD:?Required}@postgres:5432/content_automation
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Celery broker and result backend (DB 1 keeps Celery traffic
      # separate from application cache on DB 0)
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      GOOGLE_SEARCH_CONSOLE_CLIENT_ID: ${GOOGLE_SEARCH_CONSOLE_CLIENT_ID:-}
      GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET: ${GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET:-}
      GOOGLE_SEARCH_CONSOLE_REDIRECT_URI: ${GOOGLE_SEARCH_CONSOLE_REDIRECT_URI:-}
      GOOGLE_SEARCH_CONSOLE_FRONTEND_RETURN_URL: ${GOOGLE_SEARCH_CONSOLE_FRONTEND_RETURN_URL:-http://localhost:3001/?search_console=connected}
      # LLM configuration - Anthropic is the default provider
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LOCAL_LLM_URL: ${LOCAL_LLM_URL:-http://ollama:11434/v1}
      MONITORING_LOG_LEVEL: ${MONITORING_LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - content-automation-network
    deploy:
      # For horizontal scaling in production, use: docker compose up --scale celery-worker=4
      # replicas: 4  # Uncomment for swarm mode
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

  # --------------------------------------------------------------------------
  # Celery Beat (Scheduler)
  # --------------------------------------------------------------------------
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: content-automation-celery-beat
    restart: unless-stopped
    command: celery -A orchestration.celery_app.app beat --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://content_user:${POSTGRES_PASSWORD:?Required}@postgres:5432/content_automation
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Celery broker and result backend must match the worker configuration
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      GOOGLE_SEARCH_CONSOLE_CLIENT_ID: ${GOOGLE_SEARCH_CONSOLE_CLIENT_ID:-}
      GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET: ${GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET:-}
      GOOGLE_SEARCH_CONSOLE_REDIRECT_URI: ${GOOGLE_SEARCH_CONSOLE_REDIRECT_URI:-}
      GOOGLE_SEARCH_CONSOLE_FRONTEND_RETURN_URL: ${GOOGLE_SEARCH_CONSOLE_FRONTEND_RETURN_URL:-http://localhost:3001/?search_console=connected}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      MONITORING_LOG_LEVEL: ${MONITORING_LOG_LEVEL:-INFO}
    volumes:
      - ./logs:/app/logs
    networks:
      - content-automation-network

  # --------------------------------------------------------------------------
  # Flower (Celery Monitoring)
  # --------------------------------------------------------------------------
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: content-automation-flower
    restart: unless-stopped
    command: celery -A orchestration.celery_app.app flower --port=5555
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    ports:
      - "5555:5555"
    networks:
      - content-automation-network

  # --------------------------------------------------------------------------
  # pgAdmin (Optional - for development)
  # --------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: content-automation-pgadmin
    restart: unless-stopped
    profiles:
      - dev
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - content-automation-network

  # --------------------------------------------------------------------------
  # Next.js Frontend
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:8000}
    container_name: content-automation-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:8000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "--timeout=10", "http://localhost:3001/" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - content-automation-network

# ============================================================================
# Networks
# ============================================================================
networks:
  content-automation-network:
    driver: bridge

# ============================================================================
# Volumes
# ============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
  ollama_data:
    driver: local
