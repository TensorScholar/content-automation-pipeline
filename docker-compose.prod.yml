# ============================================================================
# Production Docker Compose Configuration
# Optimized for reliability, performance, and security
# ============================================================================

version: "3.9"

services:
  # --------------------------------------------------------------------------
  # PostgreSQL Database
  # --------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: content-automation-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: content_automation
      POSTGRES_USER: content_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # Localhost only for security
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U content_user -d content_automation"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - content-automation-network

  # --------------------------------------------------------------------------
  # Redis Cache
  # --------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: content-automation-redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    # Port not exposed externally - access via Docker network only
    # Uncomment for local debugging: ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - content-automation-network

  # --------------------------------------------------------------------------
  # API Server (Production with Gunicorn)
  # --------------------------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: content-automation-pipeline:${IMAGE_TAG:-latest}
    restart: "no"
    profiles: ["migrate"]
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://content_user:${POSTGRES_PASSWORD}@postgres:5432/content_automation
      REDIS_URL: redis://:${REDIS_PASSWORD:?Required}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?Required}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?Required}@redis:6379/2
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      LLM_GEMINI_MODEL: ${LLM_GEMINI_MODEL:-gemini-2.5-flash-lite}
      LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:-}
      LLM_SECONDARY_MODEL: ${LLM_SECONDARY_MODEL:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      LLM_KEYWORD_MODEL: ${LLM_KEYWORD_MODEL:-}
      LLM_PLANNING_MODEL: ${LLM_PLANNING_MODEL:-}
      LLM_WRITING_MODEL: ${LLM_WRITING_MODEL:-}
      LLM_VERIFICATION_MODEL: ${LLM_VERIFICATION_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_OPENAI_API_KEY: ${LLM_OPENAI_API_KEY:-}
      LLM_OPENAI_MODEL: ${LLM_OPENAI_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_ANTHROPIC_API_KEY: ${LLM_ANTHROPIC_API_KEY:-}
      LLM_ANTHROPIC_MODEL: ${LLM_ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      LOCAL_LLM_URL: ${LOCAL_LLM_URL:-}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY is required}
      GOOGLE_SEARCH_CONSOLE_CLIENT_ID: ${GOOGLE_SEARCH_CONSOLE_CLIENT_ID:-}
      GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET: ${GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET:-}
      GOOGLE_SEARCH_CONSOLE_REDIRECT_URI: ${GOOGLE_SEARCH_CONSOLE_REDIRECT_URI:-}
      GOOGLE_SEARCH_CONSOLE_FRONTEND_RETURN_URL: ${GOOGLE_SEARCH_CONSOLE_FRONTEND_RETURN_URL:-}
      LLM_DAILY_COST_LIMIT_USD: ${LLM_DAILY_COST_LIMIT_USD:-10}
      LLM_MONTHLY_COST_LIMIT_USD: ${LLM_MONTHLY_COST_LIMIT_USD:-100}
      LLM_PROJECT_DAILY_COST_LIMIT_USD: ${LLM_PROJECT_DAILY_COST_LIMIT_USD:-0}
      LLM_PROJECT_MONTHLY_COST_LIMIT_USD: ${LLM_PROJECT_MONTHLY_COST_LIMIT_USD:-0}
      LLM_USER_DAILY_COST_LIMIT_USD: ${LLM_USER_DAILY_COST_LIMIT_USD:-0}
      LLM_USER_MONTHLY_COST_LIMIT_USD: ${LLM_USER_MONTHLY_COST_LIMIT_USD:-0}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      ENVIRONMENT: production
      DEBUG: "false"
      MONITORING_LOG_LEVEL: ${MONITORING_LOG_LEVEL:-INFO}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,api,nginx}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost}
    networks:
      - content-automation-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: content-automation-pipeline:${IMAGE_TAG:-latest}
    # Note: container_name removed to support replicas
    init: true
    restart: unless-stopped
    command: ["api"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database configuration (async driver for Python app)
      DATABASE_URL: postgresql+asyncpg://content_user:${POSTGRES_PASSWORD}@postgres:5432/content_automation

      # Redis configuration
      REDIS_URL: redis://:${REDIS_PASSWORD:?Required}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?Required}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?Required}@redis:6379/2

      # LLM provider configuration. LLM_PROVIDER selects the required key.
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      LLM_GEMINI_MODEL: ${LLM_GEMINI_MODEL:-gemini-2.5-flash-lite}
      LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:-}
      LLM_SECONDARY_MODEL: ${LLM_SECONDARY_MODEL:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      LLM_KEYWORD_MODEL: ${LLM_KEYWORD_MODEL:-}
      LLM_PLANNING_MODEL: ${LLM_PLANNING_MODEL:-}
      LLM_WRITING_MODEL: ${LLM_WRITING_MODEL:-}
      LLM_VERIFICATION_MODEL: ${LLM_VERIFICATION_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_OPENAI_API_KEY: ${LLM_OPENAI_API_KEY:-}
      LLM_OPENAI_MODEL: ${LLM_OPENAI_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_ANTHROPIC_API_KEY: ${LLM_ANTHROPIC_API_KEY:-}
      LLM_ANTHROPIC_MODEL: ${LLM_ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      LOCAL_LLM_URL: ${LOCAL_LLM_URL:-}

      # Application configuration
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MONITORING_LOG_LEVEL: ${MONITORING_LOG_LEVEL:-INFO}
      ENVIRONMENT: production
      DEBUG: "false"
      RUN_MIGRATIONS: "false"

      # Security
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY is required}
      GOOGLE_SEARCH_CONSOLE_CLIENT_ID: ${GOOGLE_SEARCH_CONSOLE_CLIENT_ID:-}
      GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET: ${GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET:-}
      GOOGLE_SEARCH_CONSOLE_REDIRECT_URI: ${GOOGLE_SEARCH_CONSOLE_REDIRECT_URI:-}
      GOOGLE_SEARCH_CONSOLE_FRONTEND_RETURN_URL: ${GOOGLE_SEARCH_CONSOLE_FRONTEND_RETURN_URL:-}
      LLM_DAILY_COST_LIMIT_USD: ${LLM_DAILY_COST_LIMIT_USD:-10}
      LLM_MONTHLY_COST_LIMIT_USD: ${LLM_MONTHLY_COST_LIMIT_USD:-100}
      LLM_PROJECT_DAILY_COST_LIMIT_USD: ${LLM_PROJECT_DAILY_COST_LIMIT_USD:-0}
      LLM_PROJECT_MONTHLY_COST_LIMIT_USD: ${LLM_PROJECT_MONTHLY_COST_LIMIT_USD:-0}
      LLM_USER_DAILY_COST_LIMIT_USD: ${LLM_USER_DAILY_COST_LIMIT_USD:-0}
      LLM_USER_MONTHLY_COST_LIMIT_USD: ${LLM_USER_MONTHLY_COST_LIMIT_USD:-0}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,api,nginx}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost}

      # Performance tuning - Adjusted for 2 API replicas
      WORKERS: 4
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      MAX_CONNECTIONS: ${MAX_CONNECTIONS:-100}
      DB_POOL_SIZE: 5 # 2 replicas * 5 = 10 total connections
      DB_MAX_OVERFLOW: 5 # Allow burst to 10 per replica
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Importing the CPU-only NLP/embedding stack can take over a minute on
      # small VPS and CI hosts. Do not consume health retries during startup.
      start_period: 180s
    networks:
      - content-automation-network
    deploy:
      mode: replicated
      replicas: 2
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 2G
      update_config:
        parallelism: 1
        delay: 10s
      rollback_config:
        parallelism: 1
        delay: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"

  # --------------------------------------------------------------------------
  # Next.js Frontend
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    image: content-automation-frontend:${IMAGE_TAG:-latest}
    container_name: content-automation-frontend-prod
    init: true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_PROXY_TARGET: http://api:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MONITORING_LOG_LEVEL: ${MONITORING_LOG_LEVEL:-INFO}
      ENVIRONMENT: production
    expose:
      - "3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3001/', response => process.exit(response.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - content-automation-network
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # --------------------------------------------------------------------------
  # Celery Worker (Primary - for content generation tasks)
  # --------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: content-automation-pipeline:${IMAGE_TAG:-latest}
    # Note: container_name removed to support replicas
    init: true
    restart: unless-stopped
    command: ["worker"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "timeout 15s celery --broker=$$CELERY_BROKER_URL inspect ping --timeout=5 -d celery@$$HOSTNAME | grep -q pong",
        ]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 180s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://content_user:${POSTGRES_PASSWORD}@postgres:5432/content_automation
      REDIS_URL: redis://:${REDIS_PASSWORD:?Required}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?Required}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?Required}@redis:6379/2
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      LLM_GEMINI_MODEL: ${LLM_GEMINI_MODEL:-gemini-2.5-flash-lite}
      LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:-}
      LLM_SECONDARY_MODEL: ${LLM_SECONDARY_MODEL:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      LLM_KEYWORD_MODEL: ${LLM_KEYWORD_MODEL:-}
      LLM_PLANNING_MODEL: ${LLM_PLANNING_MODEL:-}
      LLM_WRITING_MODEL: ${LLM_WRITING_MODEL:-}
      LLM_VERIFICATION_MODEL: ${LLM_VERIFICATION_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_OPENAI_API_KEY: ${LLM_OPENAI_API_KEY:-}
      LLM_OPENAI_MODEL: ${LLM_OPENAI_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_ANTHROPIC_API_KEY: ${LLM_ANTHROPIC_API_KEY:-}
      LLM_ANTHROPIC_MODEL: ${LLM_ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      LOCAL_LLM_URL: ${LOCAL_LLM_URL:-}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY is required}
      GOOGLE_SEARCH_CONSOLE_CLIENT_ID: ${GOOGLE_SEARCH_CONSOLE_CLIENT_ID:-}
      GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET: ${GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET:-}
      GOOGLE_SEARCH_CONSOLE_REDIRECT_URI: ${GOOGLE_SEARCH_CONSOLE_REDIRECT_URI:-}
      GOOGLE_SEARCH_CONSOLE_FRONTEND_RETURN_URL: ${GOOGLE_SEARCH_CONSOLE_FRONTEND_RETURN_URL:-}
      LLM_DAILY_COST_LIMIT_USD: ${LLM_DAILY_COST_LIMIT_USD:-10}
      LLM_MONTHLY_COST_LIMIT_USD: ${LLM_MONTHLY_COST_LIMIT_USD:-100}
      LLM_PROJECT_DAILY_COST_LIMIT_USD: ${LLM_PROJECT_DAILY_COST_LIMIT_USD:-0}
      LLM_PROJECT_MONTHLY_COST_LIMIT_USD: ${LLM_PROJECT_MONTHLY_COST_LIMIT_USD:-0}
      LLM_USER_DAILY_COST_LIMIT_USD: ${LLM_USER_DAILY_COST_LIMIT_USD:-0}
      LLM_USER_MONTHLY_COST_LIMIT_USD: ${LLM_USER_MONTHLY_COST_LIMIT_USD:-0}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,api,nginx}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MONITORING_LOG_LEVEL: ${MONITORING_LOG_LEVEL:-INFO}
      ENVIRONMENT: production
      DEBUG: "false"
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-4}
      CELERY_LOG_LEVEL: info
      DB_POOL_SIZE: 5 # 3 replicas * 5 = 15 steady connections
      DB_MAX_OVERFLOW: 5 # Allow burst to 10 per replica
    networks:
      - content-automation-network
    deploy:
      mode: replicated
      replicas: 3 # Recommended for production load
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 2G
      update_config:
        parallelism: 1
        delay: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"

  # --------------------------------------------------------------------------
  # Celery Beat (Scheduler)
  # --------------------------------------------------------------------------
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    image: content-automation-pipeline:${IMAGE_TAG:-latest}
    container_name: content-automation-celery-beat-prod
    init: true
    restart: unless-stopped
    command: ["beat"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://content_user:${POSTGRES_PASSWORD}@postgres:5432/content_automation
      REDIS_URL: redis://:${REDIS_PASSWORD:?Required}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?Required}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?Required}@redis:6379/2
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      LLM_GEMINI_MODEL: ${LLM_GEMINI_MODEL:-gemini-2.5-flash-lite}
      LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:-}
      LLM_SECONDARY_MODEL: ${LLM_SECONDARY_MODEL:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      LLM_KEYWORD_MODEL: ${LLM_KEYWORD_MODEL:-}
      LLM_PLANNING_MODEL: ${LLM_PLANNING_MODEL:-}
      LLM_WRITING_MODEL: ${LLM_WRITING_MODEL:-}
      LLM_VERIFICATION_MODEL: ${LLM_VERIFICATION_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_OPENAI_API_KEY: ${LLM_OPENAI_API_KEY:-}
      LLM_OPENAI_MODEL: ${LLM_OPENAI_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_ANTHROPIC_API_KEY: ${LLM_ANTHROPIC_API_KEY:-}
      LLM_ANTHROPIC_MODEL: ${LLM_ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      LOCAL_LLM_URL: ${LOCAL_LLM_URL:-}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY is required}
      GOOGLE_SEARCH_CONSOLE_CLIENT_ID: ${GOOGLE_SEARCH_CONSOLE_CLIENT_ID:-}
      GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET: ${GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET:-}
      GOOGLE_SEARCH_CONSOLE_REDIRECT_URI: ${GOOGLE_SEARCH_CONSOLE_REDIRECT_URI:-}
      GOOGLE_SEARCH_CONSOLE_FRONTEND_RETURN_URL: ${GOOGLE_SEARCH_CONSOLE_FRONTEND_RETURN_URL:-}
      LLM_DAILY_COST_LIMIT_USD: ${LLM_DAILY_COST_LIMIT_USD:-10}
      LLM_MONTHLY_COST_LIMIT_USD: ${LLM_MONTHLY_COST_LIMIT_USD:-100}
      LLM_PROJECT_DAILY_COST_LIMIT_USD: ${LLM_PROJECT_DAILY_COST_LIMIT_USD:-0}
      LLM_PROJECT_MONTHLY_COST_LIMIT_USD: ${LLM_PROJECT_MONTHLY_COST_LIMIT_USD:-0}
      LLM_USER_DAILY_COST_LIMIT_USD: ${LLM_USER_DAILY_COST_LIMIT_USD:-0}
      LLM_USER_MONTHLY_COST_LIMIT_USD: ${LLM_USER_MONTHLY_COST_LIMIT_USD:-0}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,api,nginx}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MONITORING_LOG_LEVEL: ${MONITORING_LOG_LEVEL:-INFO}
      ENVIRONMENT: production
      DEBUG: "false"
      CELERY_LOG_LEVEL: info
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - content-automation-network

  # --------------------------------------------------------------------------
  # Flower (Celery Monitoring)
  # --------------------------------------------------------------------------
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    image: content-automation-pipeline:${IMAGE_TAG:-latest}
    container_name: content-automation-flower-prod
    init: true
    restart: unless-stopped
    # SECURITY: No default credentials - deployment will fail if not set
    command: >
      celery -A orchestration.celery_app.app flower --basic_auth=${FLOWER_USER:?FLOWER_USER required}:${FLOWER_PASSWORD:?FLOWER_PASSWORD required} --port=5555
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://content_user:${POSTGRES_PASSWORD}@postgres:5432/content_automation
      REDIS_URL: redis://:${REDIS_PASSWORD:?Required}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?Required}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?Required}@redis:6379/2
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      LLM_GEMINI_MODEL: ${LLM_GEMINI_MODEL:-gemini-2.5-flash-lite}
      LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:-}
      LLM_SECONDARY_MODEL: ${LLM_SECONDARY_MODEL:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      LLM_KEYWORD_MODEL: ${LLM_KEYWORD_MODEL:-}
      LLM_PLANNING_MODEL: ${LLM_PLANNING_MODEL:-}
      LLM_WRITING_MODEL: ${LLM_WRITING_MODEL:-}
      LLM_VERIFICATION_MODEL: ${LLM_VERIFICATION_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_OPENAI_API_KEY: ${LLM_OPENAI_API_KEY:-}
      LLM_OPENAI_MODEL: ${LLM_OPENAI_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_ANTHROPIC_API_KEY: ${LLM_ANTHROPIC_API_KEY:-}
      LLM_ANTHROPIC_MODEL: ${LLM_ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      LOCAL_LLM_URL: ${LOCAL_LLM_URL:-}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY is required}
      GOOGLE_SEARCH_CONSOLE_CLIENT_ID: ${GOOGLE_SEARCH_CONSOLE_CLIENT_ID:-}
      GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET: ${GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET:-}
      GOOGLE_SEARCH_CONSOLE_REDIRECT_URI: ${GOOGLE_SEARCH_CONSOLE_REDIRECT_URI:-}
      GOOGLE_SEARCH_CONSOLE_FRONTEND_RETURN_URL: ${GOOGLE_SEARCH_CONSOLE_FRONTEND_RETURN_URL:-}
      LLM_DAILY_COST_LIMIT_USD: ${LLM_DAILY_COST_LIMIT_USD:-10}
      LLM_MONTHLY_COST_LIMIT_USD: ${LLM_MONTHLY_COST_LIMIT_USD:-100}
      LLM_PROJECT_DAILY_COST_LIMIT_USD: ${LLM_PROJECT_DAILY_COST_LIMIT_USD:-0}
      LLM_PROJECT_MONTHLY_COST_LIMIT_USD: ${LLM_PROJECT_MONTHLY_COST_LIMIT_USD:-0}
      LLM_USER_DAILY_COST_LIMIT_USD: ${LLM_USER_DAILY_COST_LIMIT_USD:-0}
      LLM_USER_MONTHLY_COST_LIMIT_USD: ${LLM_USER_MONTHLY_COST_LIMIT_USD:-0}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,api,nginx}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost}
      ENVIRONMENT: production
      DEBUG: "false"
      FLOWER_USER: ${FLOWER_USER:?Required}
      FLOWER_PASSWORD: ${FLOWER_PASSWORD:?Required}
    ports:
      - "127.0.0.1:5555:5555" # Bind to localhost only for security
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - content-automation-network

  # --------------------------------------------------------------------------
  # Nginx (Reverse Proxy with TLS Termination)
  # --------------------------------------------------------------------------
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: content-automation-pipeline-nginx:${IMAGE_TAG:-latest}
    container_name: content-automation-nginx-prod
    restart: unless-stopped
    depends_on:
      - api
      - frontend
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
      NGINX_CONFIG_TEMPLATE: /etc/nginx/nginx.http.conf.template
    ports:
      - "80:80"
    volumes:
      # SSL certificates (use Let's Encrypt or custom certificates)
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # Certbot webroot for ACME challenge
      - certbot_webroot:/var/www/certbot:ro
    networks:
      - content-automation-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"

  # --------------------------------------------------------------------------
  # Certbot (Let's Encrypt SSL Certificate Manager)
  # --------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:v3.1.0
    container_name: content-automation-certbot
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - content-automation-network

# ============================================================================
# Networks
# ============================================================================
networks:
  content-automation-network:
    driver: bridge

# ============================================================================
# Volumes
# ============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  certbot_webroot:
    driver: local
