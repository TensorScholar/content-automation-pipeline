apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: content-automation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: content-automation-pipeline:1.0.0
          command: ["./entrypoint.sh", "api"]
          ports:
            - containerPort: 8000
          env:
            # POSTGRES_PASSWORD must be declared BEFORE DATABASE_URL so that
            # Kubernetes $(VAR_NAME) substitution resolves it at pod startup.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: content-automation-secrets
                  key: postgres-password
            - name: DATABASE_URL
              value: postgresql+asyncpg://content_user:$(POSTGRES_PASSWORD)@postgres:5432/content_automation
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: content-automation-secrets
                  key: secret-key
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: content-automation-secrets
                  key: anthropic-api-key
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: content-automation-secrets
                  key: openai-api-key
          envFrom:
            - configMapRef:
                name: content-automation-config
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 40
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: content-automation
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
