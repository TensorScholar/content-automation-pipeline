# =============================================================================
# EXAMPLE ONLY - DO NOT APPLY AS-IS
# =============================================================================
# This file is a documentation template for the Secret consumed by the
# workloads in this kustomization. It is intentionally NOT listed in
# kustomization.yaml and is never rendered into a deployment.
#
# The real Secret is named `content-automation-secrets` and must contain these
# keys (those marked OPTIONAL are mounted with `optional: true` in the
# workloads and may be omitted when that provider is not used):
#
#   postgres-password  REQUIRED - used by api, worker, celery-beat,
#                                 postgres, and postgres-exporter
#   secret-key         REQUIRED - used by api, worker, and celery-beat
#   anthropic-api-key  OPTIONAL - used by api, worker, celery-beat
#   openai-api-key     OPTIONAL - used by api, worker, celery-beat
#   gemini-api-key     OPTIONAL - used by api, worker, celery-beat
#   redis-password     OPTIONAL - used by redis-exporter
#
# Create the real Secret from the command line (never from this template):
#
#   kubectl create secret generic content-automation-secrets \
#     --namespace content-automation \
#     --from-literal=postgres-password='<generate-a-strong-password>' \
#     --from-literal=secret-key='<generate-a-random-secret-key>' \
#     --dry-run=client -o yaml > k8s/secrets.yaml
#
# Then apply it once:
#
#   kubectl apply -f k8s/secrets.yaml
#
# k8s/secrets.yaml is git-ignored; see .gitignore.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: content-automation-secrets
  namespace: content-automation
type: Opaque
stringData:
  postgres-password: <GENERATE-STRONG-PASSWORD>
  secret-key: <GENERATE-RANDOM-SECRET-KEY>
  # anthropic-api-key: <GENERATE-OR-REMOVE>
  # openai-api-key: <GENERATE-OR-REMOVE>
  # gemini-api-key: <GENERATE-OR-REMOVE>
  # redis-password: <GENERATE-OR-REMOVE>
