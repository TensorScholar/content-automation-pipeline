apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: content-automation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: content-automation-frontend:1.0.0
          ports:
            - containerPort: 3001
          env:
            - name: API_PROXY_TARGET
              value: http://api:8000
            - name: NEXT_PUBLIC_API_URL
              value: /api
          envFrom:
            - configMapRef:
                name: content-automation-config
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: content-automation
spec:
  selector:
    app: frontend
  ports:
    - port: 3001
      targetPort: 3001
  type: ClusterIP
