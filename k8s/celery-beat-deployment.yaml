apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: content-automation
spec:
  replicas: 1 # Must be exactly 1 for beat scheduler
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      containers:
        - name: celery-beat
          image: content-automation-pipeline:1.0.0
          command: ["./entrypoint.sh", "beat"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: content-automation-secrets
                  key: postgres-password
            - name: DATABASE_URL
              value: postgresql+asyncpg://content_user:$(POSTGRES_PASSWORD)@postgres:5432/content_automation
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: content-automation-secrets
                  key: secret-key
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: content-automation-secrets
                  key: anthropic-api-key
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: content-automation-secrets
                  key: openai-api-key
                  optional: true
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: content-automation-secrets
                  key: gemini-api-key
                  optional: true
          envFrom:
            - configMapRef:
                name: content-automation-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
  strategy:
    type: Recreate # Ensures only one beat instance runs
