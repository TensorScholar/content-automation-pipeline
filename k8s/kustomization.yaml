apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: content-automation

resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - postgres-deployment.yaml
  - redis-deployment.yaml
  - api-deployment.yaml
  - worker-deployment.yaml
  - frontend-deployment.yaml
  - celery-beat-deployment.yaml
  - ingress.yaml
  - postgres-exporter-deployment.yaml
  - redis-exporter-deployment.yaml
  - node-exporter-daemonset.yaml

commonLabels:
  app.kubernetes.io/name: content-automation
  app.kubernetes.io/version: "1.0.0"
  app.kubernetes.io/managed-by: kustomize

# =============================================================================
# Image Tag Pinning
# =============================================================================
# All images are pinned to specific versions for reproducible deployments.
# To deploy a new version, update the tag here and re-apply:
#   kustomize build k8s/ | kubectl apply -f -
#
# NEVER use :latest in production — it makes rollbacks unreliable and
# breaks reproducibility.
# =============================================================================
images:
  # Backend application image — update this tag on each release
  - name: content-automation-pipeline
    newTag: "1.0.0"

  # Frontend application image — update this tag on each release
  - name: content-automation-frontend
    newTag: "1.0.0"

  # PostgreSQL with pgvector extension
  - name: pgvector/pgvector
    newTag: "0.8.0-pg16"

  # Redis cache
  - name: redis
    newTag: "7.4-alpine"
