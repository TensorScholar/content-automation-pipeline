name: Phase 4A Integrity Hardening

on:
  push:
    branches:
      - feat/phase4a-revision-backbone
    paths:
      - .phase4a-hardening-trigger

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply guarded integrity hardening
        run: python .phase4a_hardening.py

      - name: Validate hardened patch
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall \
            knowledge/article_repository.py \
            alembic/versions/20260903_revision_backbone.py \
            tests/test_revision_backbone_truth.py \
            tests/integration/test_revision_backbone_migration_postgres.py
          python scripts/maintenance/validate_migration_graph.py
          python -m pip install --quiet ruff==0.5.7
          ruff check --fix --select I \
            alembic/versions/20260903_revision_backbone.py \
            tests/test_revision_backbone_truth.py \
            tests/integration/test_revision_backbone_migration_postgres.py
          ruff format \
            alembic/versions/20260903_revision_backbone.py \
            tests/test_revision_backbone_truth.py \
            tests/integration/test_revision_backbone_migration_postgres.py
          ruff check \
            knowledge/article_repository.py \
            alembic/versions/20260903_revision_backbone.py \
            tests/test_revision_backbone_truth.py \
            tests/integration/test_revision_backbone_migration_postgres.py
          ruff format --check \
            alembic/versions/20260903_revision_backbone.py \
            tests/test_revision_backbone_truth.py \
            tests/integration/test_revision_backbone_migration_postgres.py
          git diff --check

      - name: Remove hardening-only artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .phase4a_hardening.py \
            .phase4a-hardening-trigger \
            .github/workflows/phase4a-hardening.yml
          git diff --check

      - name: Commit hardened production patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TensorScholar Engineering Bot"
          git config user.email "132380678+TensorScholar@users.noreply.github.com"
          git add -A
          echo "=== final diff ==="
          git diff --cached --stat
          git diff --cached --name-only
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No hardening changes staged" >&2
            exit 1
          fi
          git commit -m "fix: preserve revision provenance and enforce ledger integrity"
          git push origin HEAD:feat/phase4a-revision-backbone
