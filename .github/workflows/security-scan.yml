# =============================================================================
# Security Scanning Pipeline — Content Automation Pipeline
# =============================================================================
# Runs on every push/PR and weekly scheduled scans.
# Scans dependencies for known vulnerabilities using pip-audit and safety.
# =============================================================================

name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Dependency Vulnerability Scan
  # ===========================================================================
  dependency-scan:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-security-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-security-

      - name: Install scanning tools
        run: |
          pip install --upgrade pip
          pip install poetry==1.8.3 pip-audit safety==3.8.1

      - name: Export requirements from Poetry
        run: |
          poetry export -f requirements.txt --output requirements.txt --without-hashes

      - name: Run pip-audit
        id: pip_audit
        run: |
          set -euo pipefail
          set +e
          pip-audit -r requirements.txt --desc --format json --output pip-audit-report.json
          scan_status=$?
          set -e

          SCAN_STATUS="$scan_status" python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path("pip-audit-report.json")
          if not report_path.is_file() or report_path.stat().st_size == 0:
              raise SystemExit("pip-audit did not produce a required JSON report")

          try:
              data = json.loads(report_path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(f"pip-audit report is unreadable or malformed: {exc}") from exc

          if isinstance(data, dict) and isinstance(data.get("dependencies"), list):
              dependencies = data["dependencies"]
              vulnerability_count = 0
              for dependency in dependencies:
                  if not isinstance(dependency, dict) or not isinstance(
                      dependency.get("vulns", []), list
                  ):
                      raise SystemExit("pip-audit report has an unexpected dependency schema")
                  vulnerability_count += len(dependency.get("vulns", []))
          elif isinstance(data, list):
              vulnerability_count = 0
              for dependency in data:
                  if not isinstance(dependency, dict) or not isinstance(
                      dependency.get("vulns", []), list
                  ):
                      raise SystemExit("pip-audit report has an unexpected list schema")
                  vulnerability_count += len(dependency.get("vulns", []))
          else:
              raise SystemExit("pip-audit report has an unsupported top-level schema")

          scan_status = int(os.environ["SCAN_STATUS"])
          if scan_status not in (0, 1):
              raise SystemExit(f"pip-audit execution failed with status {scan_status}")
          if scan_status == 1 and vulnerability_count == 0:
              raise SystemExit(
                  "pip-audit returned its findings status without report findings"
              )

          Path("pip-audit-report.txt").write_text(
              f"pip-audit completed with {vulnerability_count} vulnerability finding(s).\n",
              encoding="utf-8",
          )
          PY

      - name: Run safety check
        id: safety_check
        run: |
          set -euo pipefail
          set +e
          safety check -r requirements.txt --save-json safety-report.json
          scan_status=$?
          set -e

          SCAN_STATUS="$scan_status" python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path("safety-report.json")
          if not report_path.is_file() or report_path.stat().st_size == 0:
              raise SystemExit("Safety did not produce a required JSON report")

          try:
              data = json.loads(report_path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(f"Safety report is unreadable or malformed: {exc}") from exc

          if isinstance(data, list):
              vulnerability_count = len(data)
          elif isinstance(data, dict) and isinstance(data.get("vulnerabilities"), list):
              vulnerability_count = len(data["vulnerabilities"])
          else:
              raise SystemExit("Safety report has an unsupported top-level schema")

          scan_status = int(os.environ["SCAN_STATUS"])
          if scan_status not in (0, 64):
              raise SystemExit(f"Safety execution failed with status {scan_status}")
          if scan_status == 64 and vulnerability_count == 0:
              raise SystemExit(
                  "Safety returned its findings status without report findings"
              )

          Path("safety-report.txt").write_text(
              f"Safety completed with {vulnerability_count} vulnerability finding(s).\n",
              encoding="utf-8",
          )
          PY

      - name: Evaluate scan results
        run: |
          set -euo pipefail
          echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY

          read -r VULN_COUNT SAFETY_COUNT < <(python - <<'PY'
          import json
          from pathlib import Path

          def load_required(path: str):
              report = Path(path)
              if not report.is_file() or report.stat().st_size == 0:
                  raise SystemExit(f"Required scanner report is missing or empty: {path}")
              try:
                  return json.loads(report.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError) as exc:
                  raise SystemExit(f"Required scanner report is malformed: {path}: {exc}") from exc

          pip_data = load_required("pip-audit-report.json")
          if isinstance(pip_data, dict) and isinstance(pip_data.get("dependencies"), list):
              pip_entries = pip_data["dependencies"]
          elif isinstance(pip_data, list):
              pip_entries = pip_data
          else:
              raise SystemExit("pip-audit report has an unsupported schema")
          pip_count = sum(len(entry.get("vulns", [])) for entry in pip_entries)

          safety_data = load_required("safety-report.json")
          if isinstance(safety_data, list):
              safety_count = len(safety_data)
          elif isinstance(safety_data, dict) and isinstance(
              safety_data.get("vulnerabilities"), list
          ):
              safety_count = len(safety_data["vulnerabilities"])
          else:
              raise SystemExit("Safety report has an unsupported schema")

          print(pip_count, safety_count)
          PY
          )
          echo "| pip-audit | $VULN_COUNT vulnerability(ies) found |" >> $GITHUB_STEP_SUMMARY
          echo "| safety | $SAFETY_COUNT issue(s) found |" >> $GITHUB_STEP_SUMMARY

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-reports
          path: |
            pip-audit-report.*
            safety-report.*
          retention-days: 90

  # ===========================================================================
  # Static Application Security Testing (Bandit)
  # ===========================================================================
  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit scan
        run: |
          set -euo pipefail
          set +e
          bandit -r \
            api/ \
            core/ \
            services/ \
            infrastructure/ \
            orchestration/ \
            execution/ \
            intelligence/ \
            knowledge/ \
            optimization/ \
            -f json \
            -o bandit-report.json \
            --severity-level medium \
            --confidence-level medium \
            2>&1
          scan_status=$?
          set -e

          SCAN_STATUS="$scan_status" python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path("bandit-report.json")
          if not report_path.is_file() or report_path.stat().st_size == 0:
              raise SystemExit("Bandit did not produce a required JSON report")

          try:
              data = json.loads(report_path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(f"Bandit report is unreadable or malformed: {exc}") from exc

          results = data.get("results") if isinstance(data, dict) else None
          if not isinstance(results, list):
              raise SystemExit("Bandit report has an unsupported schema")

          scan_status = int(os.environ["SCAN_STATUS"])
          if scan_status not in (0, 1):
              raise SystemExit(f"Bandit execution failed with status {scan_status}")
          if scan_status == 1 and not results:
              raise SystemExit(
                  "Bandit returned its findings status without report findings"
              )
          PY

      - name: Generate Bandit summary
        if: always()
        run: |
          set -euo pipefail
          echo "## 🛡️ SAST (Bandit) Summary" >> $GITHUB_STEP_SUMMARY
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          report = Path("bandit-report.json")
          if not report.is_file() or report.stat().st_size == 0:
              raise SystemExit("Required Bandit report is missing or empty")
          try:
              data = json.loads(report.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(f"Required Bandit report is malformed: {exc}") from exc
          if not isinstance(data, dict) or not isinstance(data.get("results"), list):
              raise SystemExit("Bandit report has an unsupported schema")
          metrics = data.get('metrics', {}).get('_totals', {})
          results = data.get('results', [])
          high = sum(1 for r in results if r.get('issue_severity') == 'HIGH')
          med = sum(1 for r in results if r.get('issue_severity') == 'MEDIUM')
          low = sum(1 for r in results if r.get('issue_severity') == 'LOW')
          print(f'| Severity | Count |')
          print(f'|----------|-------|')
          print(f'| High | {high} |')
          print(f'| Medium | {med} |')
          print(f'| Low | {low} |')
          PY

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-sast-report
          path: bandit-report.json
          retention-days: 90

  # ===========================================================================
  # Secret Detection
  # ===========================================================================
  secret-detection:
    name: Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # Final Gate — Fail on Critical Vulnerabilities
  # ===========================================================================
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [dependency-scan, sast, secret-detection]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Download pip-audit report
        uses: actions/download-artifact@v4
        with:
          name: security-scan-reports
          path: reports/

      - name: Download Bandit report
        uses: actions/download-artifact@v4
        with:
          name: bandit-sast-report
          path: reports/

      - name: Evaluate security gate
        run: |
          set -euo pipefail
          echo "## 🚦 Security Gate Decision" >> $GITHUB_STEP_SUMMARY
          FAILED=0

          # Check for HIGH severity Bandit findings
          HIGH_COUNT=$(python - <<'PY'
          import json
          from pathlib import Path

          report = Path("reports/bandit-report.json")
          if not report.is_file() or report.stat().st_size == 0:
              raise SystemExit("Required Bandit report is missing or empty")
          try:
              data = json.loads(report.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(f"Required Bandit report is malformed: {exc}") from exc
          if not isinstance(data, dict) or not isinstance(data.get("results"), list):
              raise SystemExit("Bandit report has an unsupported schema")
          results = data.get('results', [])
          high = [r for r in results if r.get('issue_severity') == 'HIGH' and r.get('issue_confidence') == 'HIGH']
          print(len(high))
          PY
          )

          if [ "$HIGH_COUNT" -gt 0 ]; then
            echo "❌ **$HIGH_COUNT high-severity + high-confidence SAST finding(s)**" >> $GITHUB_STEP_SUMMARY
            FAILED=1
          else
            echo "✅ No high-severity SAST findings" >> $GITHUB_STEP_SUMMARY
          fi

          # pip-audit reports are high-confidence dependency findings. Treat any
          # reported vulnerability as blocking for production launch readiness.
          PIP_AUDIT_COUNT=$(python - <<'PY'
          import json
          from pathlib import Path

          report = Path("reports/pip-audit-report.json")
          if not report.is_file() or report.stat().st_size == 0:
              raise SystemExit("Required pip-audit report is missing or empty")
          try:
              data = json.loads(report.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(f"Required pip-audit report is malformed: {exc}") from exc
          if isinstance(data, dict) and isinstance(data.get("dependencies"), list):
              dependencies = data["dependencies"]
          elif isinstance(data, list):
              dependencies = data
          else:
              raise SystemExit("pip-audit report has an unsupported schema")
          count = 0
          for dependency in dependencies:
              if not isinstance(dependency, dict) or not isinstance(
                  dependency.get("vulns", []), list
              ):
                  raise SystemExit("pip-audit report has an unexpected dependency schema")
              count += len(dependency.get("vulns", []))
          print(count)
          PY
          )

          if [ "$PIP_AUDIT_COUNT" -gt 0 ]; then
            echo "❌ **$PIP_AUDIT_COUNT dependency vulnerability finding(s)**" >> $GITHUB_STEP_SUMMARY
            FAILED=1
          else
            echo "✅ No pip-audit dependency vulnerabilities" >> $GITHUB_STEP_SUMMARY
          fi

          # Check upstream job results
          if [ "${{ needs.dependency-scan.result }}" = "failure" ]; then
            echo "❌ **Dependency scan job failed**" >> $GITHUB_STEP_SUMMARY
            FAILED=1
          fi

          if [ "${{ needs.sast.result }}" = "failure" ]; then
            echo "❌ **SAST job failed**" >> $GITHUB_STEP_SUMMARY
            FAILED=1
          fi

          if [ "${{ needs.secret-detection.result }}" = "failure" ]; then
            echo "❌ **Secret detection found potential leaks**" >> $GITHUB_STEP_SUMMARY
            FAILED=1
          else
            echo "✅ No secrets detected" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🚫 **Security gate FAILED** — review findings before merging." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Security gate PASSED**" >> $GITHUB_STEP_SUMMARY
          fi
