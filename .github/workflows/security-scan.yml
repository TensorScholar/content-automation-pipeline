# =============================================================================
# Security Scanning Pipeline — Content Automation Pipeline
# =============================================================================
# Runs on every push/PR and weekly scheduled scans.
# Scans dependencies for known vulnerabilities using pip-audit and safety.
# =============================================================================

name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Dependency Vulnerability Scan
  # ===========================================================================
  dependency-scan:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-security-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-security-

      - name: Install scanning tools
        run: |
          pip install --upgrade pip
          pip install poetry==1.8.3 pip-audit safety

      - name: Export requirements from Poetry
        run: |
          poetry export -f requirements.txt --output requirements.txt --without-hashes

      - name: Run pip-audit
        id: pip_audit
        continue-on-error: true
        run: |
          echo "## pip-audit Results" > pip-audit-report.txt
          pip-audit -r requirements.txt --desc --output json > pip-audit-report.json 2>&1 || true
          pip-audit -r requirements.txt --desc >> pip-audit-report.txt 2>&1 || true
          echo "Scan complete. See artifact for details."

      - name: Run safety check
        id: safety_check
        continue-on-error: true
        run: |
          echo "## Safety Results" > safety-report.txt
          safety check -r requirements.txt --output json > safety-report.json 2>&1 || true
          safety check -r requirements.txt >> safety-report.txt 2>&1 || true
          echo "Scan complete. See artifact for details."

      - name: Evaluate scan results
        run: |
          echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY

          # Check pip-audit results
          if [ -f pip-audit-report.json ]; then
            VULN_COUNT=$(python -c "
          import json, sys
          try:
              data = json.load(open('pip-audit-report.json'))
              if isinstance(data, dict):
                  vulns = data.get('vulnerabilities', [])
              elif isinstance(data, list):
                  vulns = [d for d in data if d.get('vulns')]
              else:
                  vulns = []
              print(len(vulns))
          except Exception:
              print(0)
          " 2>/dev/null || echo "0")
            echo "| pip-audit | $VULN_COUNT vulnerability(ies) found |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| pip-audit | Report not generated |" >> $GITHUB_STEP_SUMMARY
          fi

          # Check safety results
          if [ -f safety-report.json ]; then
            SAFETY_COUNT=$(python -c "
          import json, sys
          try:
              data = json.load(open('safety-report.json'))
              if isinstance(data, list):
                  print(len(data))
              elif isinstance(data, dict):
                  print(len(data.get('vulnerabilities', [])))
              else:
                  print(0)
          except Exception:
              print(0)
          " 2>/dev/null || echo "0")
            echo "| safety | $SAFETY_COUNT issue(s) found |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| safety | Report not generated |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-reports
          path: |
            pip-audit-report.*
            safety-report.*
          retention-days: 90

  # ===========================================================================
  # Static Application Security Testing (Bandit)
  # ===========================================================================
  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit scan
        continue-on-error: true
        run: |
          bandit -r \
            api/ \
            core/ \
            services/ \
            infrastructure/ \
            orchestration/ \
            execution/ \
            intelligence/ \
            knowledge/ \
            optimization/ \
            -f json \
            -o bandit-report.json \
            --severity-level medium \
            --confidence-level medium \
            2>&1 || true

      - name: Generate Bandit summary
        if: always()
        run: |
          echo "## 🛡️ SAST (Bandit) Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f bandit-report.json ]; then
            python -c "
          import json
          data = json.load(open('bandit-report.json'))
          metrics = data.get('metrics', {}).get('_totals', {})
          results = data.get('results', [])
          high = sum(1 for r in results if r.get('issue_severity') == 'HIGH')
          med = sum(1 for r in results if r.get('issue_severity') == 'MEDIUM')
          low = sum(1 for r in results if r.get('issue_severity') == 'LOW')
          print(f'| Severity | Count |')
          print(f'|----------|-------|')
          print(f'| High | {high} |')
          print(f'| Medium | {med} |')
          print(f'| Low | {low} |')
          " >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Could not parse Bandit report" >> $GITHUB_STEP_SUMMARY
          else
            echo "Bandit report was not generated." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-sast-report
          path: bandit-report.json
          retention-days: 90

  # ===========================================================================
  # Secret Detection
  # ===========================================================================
  secret-detection:
    name: Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # Final Gate — Fail on Critical Vulnerabilities
  # ===========================================================================
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [dependency-scan, sast, secret-detection]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Download pip-audit report
        uses: actions/download-artifact@v4
        with:
          name: security-scan-reports
          path: reports/
        continue-on-error: true

      - name: Download Bandit report
        uses: actions/download-artifact@v4
        with:
          name: bandit-sast-report
          path: reports/
        continue-on-error: true

      - name: Evaluate security gate
        run: |
          echo "## 🚦 Security Gate Decision" >> $GITHUB_STEP_SUMMARY
          FAILED=0

          # Check for HIGH severity Bandit findings
          if [ -f reports/bandit-report.json ]; then
            HIGH_COUNT=$(python -c "
          import json
          data = json.load(open('reports/bandit-report.json'))
          results = data.get('results', [])
          high = [r for r in results if r.get('issue_severity') == 'HIGH' and r.get('issue_confidence') == 'HIGH']
          print(len(high))
          " 2>/dev/null || echo "0")

            if [ "$HIGH_COUNT" -gt 0 ] 2>/dev/null; then
              echo "❌ **$HIGH_COUNT high-severity + high-confidence SAST finding(s)**" >> $GITHUB_STEP_SUMMARY
              FAILED=1
            else
              echo "✅ No high-severity SAST findings" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ Bandit report not available" >> $GITHUB_STEP_SUMMARY
          fi

          # pip-audit reports are high-confidence dependency findings. Treat any
          # reported vulnerability as blocking for production launch readiness.
          if [ -f reports/pip-audit-report.json ]; then
            PIP_AUDIT_COUNT=$(python -c "
          import json
          data = json.load(open('reports/pip-audit-report.json'))
          if isinstance(data, dict):
              print(len(data.get('vulnerabilities', [])))
          elif isinstance(data, list):
              print(sum(len(item.get('vulns', [])) for item in data))
          else:
              print(0)
          " 2>/dev/null || echo "0")

            if [ "$PIP_AUDIT_COUNT" -gt 0 ] 2>/dev/null; then
              echo "❌ **$PIP_AUDIT_COUNT dependency vulnerability finding(s)**" >> $GITHUB_STEP_SUMMARY
              FAILED=1
            else
              echo "✅ No pip-audit dependency vulnerabilities" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ pip-audit report not available" >> $GITHUB_STEP_SUMMARY
          fi

          # Check upstream job results
          if [ "${{ needs.dependency-scan.result }}" = "failure" ]; then
            echo "❌ **Dependency scan job failed**" >> $GITHUB_STEP_SUMMARY
            FAILED=1
          fi

          if [ "${{ needs.secret-detection.result }}" = "failure" ]; then
            echo "❌ **Secret detection found potential leaks**" >> $GITHUB_STEP_SUMMARY
            FAILED=1
          else
            echo "✅ No secrets detected" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🚫 **Security gate FAILED** — review findings before merging." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Security gate PASSED**" >> $GITHUB_STEP_SUMMARY
          fi
