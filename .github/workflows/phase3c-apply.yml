name: Phase 3C Apply

on:
  push:
    branches:
      - refactor/phase3c-remove-generic-distribution
    paths:
      - .phase3c-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/phase3c-remove-generic-distribution
          fetch-depth: 0
      - name: Apply deterministic Phase 3C cleanup
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/phase3c.py
          python /tmp/phase3c.py
          python -m compileall -q core api knowledge services orchestration
          git diff --check
          rm -f .github/workflows/phase3c-apply.yml .phase3c-trigger
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: remove generic distribution from generation domain'
          git push origin HEAD:refactor/phase3c-remove-generic-distribution
