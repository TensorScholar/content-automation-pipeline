name: One-shot service boundary cleanup

on:
  push:
    branches:
      - refactor/truthful-distribution-surface

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/truthful-distribution-surface
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Remove stale generic distribution semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('services/content_service.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '- Distribution management': '- WordPress publication coordination',
              'from core.enums import DistributionChannel\n': '',
              'from execution.distributer import Distributor\n': '',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected text not found: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python -m pip install --quiet ruff==0.5.7
          ruff check --select F401 services/content_service.py
          python -m compileall -q services/content_service.py
          git diff --check
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/content_service.py
          git commit -m 'refactor: align content service publication boundary'
          git push origin HEAD:refactor/truthful-distribution-surface
