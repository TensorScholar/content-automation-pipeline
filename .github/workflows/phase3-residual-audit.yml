name: Phase 3 Residual Distribution Audit

on:
  push:
    branches:
      - audit/phase3-residual-distribution-surface

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit final dependency edges
        shell: bash
        run: |
          set -euo pipefail
          for term in \
            _publishing_service \
            ArticleResponse \
            'from api.schemas' \
            'import api.schemas' \
            'Distribution management' \
            'ContentGenerationRequest'
          do
            echo "=== ${term} ==="
            git grep -n -F "${term}" -- ':!.github/workflows/phase3-residual-audit.yml' || true
          done
