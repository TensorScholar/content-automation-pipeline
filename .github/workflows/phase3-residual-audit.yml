name: Phase 3 Residual Distribution Audit

on:
  push:
    branches:
      - audit/phase3-residual-distribution-surface

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit residual distribution surface
        shell: bash
        run: |
          set -euo pipefail
          echo '=== generic distribution consumers ==='
          git grep -n -E 'distributed|distribution_channels|auto_distribute|ContentGenerationRequest|generate_content_workflow|mark_distributed|update_(article_)?distribution' -- api core frontend knowledge orchestration services tests || true
