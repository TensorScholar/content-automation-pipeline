name: Temporary Security Lock Refresh

on:
  push:
    branches:
      - security/upgrade-transformers-cve-2026-9856

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: security/upgrade-transformers-cve-2026-9856

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry==1.8.3

      - name: Refresh lockfile
        run: |
          poetry lock --no-update
          poetry check
          poetry export --with dev --format requirements.txt --without-hashes --output /tmp/requirements-security.txt
          python - <<'PY'
          from pathlib import Path
          import re

          lock = Path('poetry.lock').read_text(encoding='utf-8')
          match = re.search(r'\[\[package\]\]\nname = "transformers"\nversion = "([^"]+)"', lock)
          if match is None:
              raise SystemExit('transformers is missing from poetry.lock')
          if match.group(1) != '5.10.2':
              raise SystemExit(f'expected transformers 5.10.2, got {match.group(1)}')
          PY

      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- poetry.lock; then
            echo 'poetry.lock already satisfies the updated constraint'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add poetry.lock
          git commit -m 'build: refresh lock for transformers security fix'
          git push origin HEAD:security/upgrade-transformers-cve-2026-9856
