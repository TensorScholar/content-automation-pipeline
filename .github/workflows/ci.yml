# =============================================================================
# CI/CD Pipeline — Content Automation Pipeline
# =============================================================================
# Runs on every push and PR to main/develop.
# Stages: Lint → Test → Build → Push
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Stage 1: Lint
  # ===========================================================================
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-

      - name: Install linting tools
        run: |
          pip install --upgrade pip
          pip install ruff mypy bandit

      - name: Run Ruff linter
        run: ruff check . --output-format=github

      - name: Run Ruff formatter check
        run: ruff format --check .

      - name: Run Bandit security linter
        run: bandit -r api/ core/ services/ infrastructure/ orchestration/ execution/ intelligence/ knowledge/ optimization/ -c pyproject.toml --severity-level high --confidence-level high -f json -o bandit-report.json

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30

  # ===========================================================================
  # Stage 2: Test
  # ===========================================================================
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: content_automation_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d content_automation_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/content_automation_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-minimum-32-chars-long-for-validation
      ENVIRONMENT: development
      ANTHROPIC_API_KEY: sk-ant-test-placeholder
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-

      - name: Install Poetry
        run: |
          pip install --upgrade pip
          pip install poetry==1.8.3

      - name: Install dependencies
        run: |
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-ansi

      - name: Download spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Run unit and integration tests
        run: |
          set -o pipefail
          pytest tests/ \
            -v \
            --tb=short \
            --strict-markers \
            -x \
            --timeout=120 \
            --ignore=tests/locustfile.py \
            -k "not slow" \
            2>&1 | head -500

      - name: Run property-based tests
        run: |
          set -o pipefail
          pytest tests/property_based/ \
            -v \
            --tb=short \
            --timeout=60 \
            2>&1 | head -200

  # ===========================================================================
  # Stage 3: Frontend Production Build
  # ===========================================================================
  frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # ===========================================================================
  # Stage 4: Docker and Compose Validation
  # ===========================================================================
  docker-build-validate:
    name: Docker & Compose Validation
    runs-on: ubuntu-latest
    needs: [test, frontend]
    timeout-minutes: 25
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
      SECRET_KEY: ci-secret-key-minimum-32-chars-long-for-validation
      SERVER_NAME: localhost
      ALLOWED_HOSTS: localhost,127.0.0.1,api,nginx
      CORS_ORIGINS: https://localhost
      LLM_PROVIDER: gemini
      GEMINI_API_KEY: ci-gemini-placeholder
      FLOWER_USER: admin
      FLOWER_PASSWORD: ci-flower-password

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose configs
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.prod.yml -f docker-compose.prod.https.yml config --quiet

      - name: Build backend Docker image
        run: docker build -f Dockerfile --build-arg POETRY_VERSION=1.8.3 .

      - name: Build frontend Docker image
        run: docker build -f frontend/Dockerfile --build-arg NEXT_PUBLIC_API_URL=/api frontend

  # ===========================================================================
  # Stage 5: Build & Push Docker Image
  # ===========================================================================
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, frontend, docker-build-validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDD'}}-{{sha}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            POETRY_VERSION=1.8.3

      - name: Generate build summary
        run: |
          echo "## 🚀 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tags** | \`${{ steps.meta.outputs.tags }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Stage 6: Pre-Deploy Validation (main branch only)
  # ===========================================================================
  validate:
    name: Pre-Deploy Validation
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
      SECRET_KEY: ci-secret-key-minimum-32-chars-long-for-validation
      SERVER_NAME: localhost
      ALLOWED_HOSTS: localhost,127.0.0.1,api,nginx
      CORS_ORIGINS: https://localhost
      LLM_PROVIDER: gemini
      GEMINI_API_KEY: ci-gemini-placeholder
      FLOWER_USER: admin
      FLOWER_PASSWORD: ci-flower-password

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose configs
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet
          echo "✅ All Docker Compose configs are valid"

      - name: Validate Kubernetes manifests
        run: |
          for f in k8s/*.yaml; do
            echo "Validating $f..."
            python -c "
          import yaml, sys
          with open('$f') as fh:
              list(yaml.safe_load_all(fh))
          print(f'  ✓ {\"$f\"} is valid YAML')
          " || { echo "❌ Invalid: $f"; exit 1; }
          done
          echo "✅ All K8s manifests are valid YAML"

      - name: Deployment ready summary
        run: |
          echo "## ✅ Deployment Validation Passed" >> $GITHUB_STEP_SUMMARY
          echo "All checks passed. Image is ready for deployment." >> $GITHUB_STEP_SUMMARY
