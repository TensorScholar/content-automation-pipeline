name: Phase 3 Content Agent Audit

on:
  push:
    branches:
      - refactor/content-agent-generation-boundary

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repository-wide reference audit
        shell: bash
        run: |
          set -euo pipefail
          for term in \
            enable_auto_distribution \
            require_manual_approval \
            max_generation_retries \
            enable_pattern_inference \
            default_priority \
            'WorkflowState.DISTRIBUTION' \
            _distribute_article \
            'ContentAgentConfig(' \
            max_retries \
            timeout_seconds \
            enable_caching
          do
            echo "=== ${term} ==="
            git grep -n -F "${term}" -- ':!.github/workflows/phase3-content-agent-audit.yml' || true
          done
