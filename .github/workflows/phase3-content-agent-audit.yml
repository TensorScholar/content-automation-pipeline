name: Phase 3 Content Agent Boundary Cleanup

on:
  push:
    branches:
      - refactor/content-agent-generation-boundary

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and validate deterministic cleanup
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import base64; exec(base64.b64decode(""))'
          git diff --check
          git status --short

      - name: Commit production cleanup and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/phase3-content-agent-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: keep content agent generation-only"
          git push origin HEAD:refactor/content-agent-generation-boundary
